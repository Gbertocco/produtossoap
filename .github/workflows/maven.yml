name: Validacao do Web Service SOAP

on:
  push:
    branches: [main, seguranca]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e executar os testes de contrato e seguranca
        run: sh mvnw -B -ntp clean verify
